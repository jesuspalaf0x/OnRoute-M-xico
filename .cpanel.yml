---
deployment:
  tasks:
    - /bin/sh -c 'TARGET=""; for d in ../subdomains/holybakery/public_html ../../subdomains/holybakery/public_html ~/subdomains/holybakery/public_html ~/public_html/holybakery ../public_html ../../public_html ~/holybakery.onroutemx.com; do if [ -d "$d" ]; then TARGET="$d"; break; fi; done; if [ -n "$TARGET" ]; then echo "Deploying to $TARGET"; /bin/cp holybakery_api_confirm.php "$TARGET/wp-content/plugins/holybakery_api_confirm.php" || true; /bin/cp create-missing-tables.php "$TARGET/create-missing-tables.php" || true; /bin/cp fix-employees.php "$TARGET/fix-employees.php" || true; /bin/cp -R holybakery-app/dist/* "$TARGET/" || true; else echo "Target not found"; fi'
    - /bin/sh -c 'MAIN=""; for d in ../public_html ../../public_html ~/public_html; do if [ -d "$d" ]; then MAIN="$d"; break; fi; done; if [ -n "$MAIN" ]; then /bin/rm -f "$MAIN/index.html" || true; /bin/cp holybakery_api_confirm.php "$MAIN/wp-content/plugins/holybakery_api_confirm.php" || true; /bin/cp cleanup-main-domain.php "$MAIN/cleanup-main-domain.php" || true; /bin/cp fix-wp-plugin.php "$MAIN/fix-wp-plugin.php" || true; fi'
