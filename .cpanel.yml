---
deployment:
  tasks:
    # ⚠️  IMPORTANTE: Este repo despliega ÚNICAMENTE el plugin de WordPress al subdominio holybakery.onroutemx.com
    # La ruta ../../public_html apunta a onroutemx.com (sitio web principal) — NO USAR para archivos de la app.
    # Solo copiar el plugin PHP al WordPress de holybakery (que tiene su propio wp-content)
    - export HOLYBAKERY_WP=../../subdomains/holybakery/public_html

    # Copiar el plugin de WordPress al subdominio holybakery
    - /bin/cp holybakery_api_confirm.php $HOLYBAKERY_WP/wp-content/plugins/holybakery_api_confirm.php

    # Copiar script de limpieza al dominio PRINCIPAL para ejecutarlo manualmente desde navegador
    # NOTA: Este script limpia los archivos de la app que se copiaron accidentalmente
    - /bin/cp cleanup-main-domain.php ../../public_html/cleanup-main-domain.php
